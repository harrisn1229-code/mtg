<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Binder</title>
<meta name="description" content="Magic: The Gathering collection, decks and wishlist. Works offline; your collection stays on this device.">
<meta name="theme-color" content="#F3F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Binder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  /* Theme from Settings, applied before first paint so there's no flash.
     data-theme = light|dark when overridden; absent = follow the system. */
  window.mtgLook = function(p){
    p = p || {};
    var r = document.documentElement, t = p.theme;
    if (t === "light" || t === "dark") r.setAttribute("data-theme", t); else r.removeAttribute("data-theme");
    var dark = t === "dark" || (t !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#0D0E10" : "#F3F3F6");
  };
  (function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem("mtg:prefs") || "{}") || {}; } catch(e){}
    window.mtgLook(p);
  })();
</script>
<style>
  /* Layout: an app shell. A translucent sticky top bar per screen, the screen body, and a
     bottom tab bar on phones that becomes a left rail at 900px and up. Card images carry the
     colour; the chrome stays neutral with one orange accent. Sheets rise from the bottom on
     phones and sit centred as dialogs on wide screens. */
  :root{
    --bg:#F3F3F6; --surface:#FFFFFF; --surface-2:#EFF0F3; --surface-3:#E2E4E9;
    --text:#15161A; --muted:#5E626E; --faint:#8B8F99;
    --line:#E3E4E9; --edge:rgb(20 22 30 / .08);
    --accent:#E0631C; --accent-text:#B44B0C; --accent-soft:#FCEADC; --on-accent:#FFFFFF;
    --ok:#1B8A4B; --ok-soft:#DFF2E6; --warn:#A16500; --warn-soft:#FAEFD8; --danger:#C53A22; --danger-soft:#FBE4DF;
    --toast-bg:#1C1D21; --toast-ink:#F2F3F5; --toast-act:#FFAE74;
    --scrim:rgb(12 13 16 / .45);
    --shadow:22 24 32;
    --sh-1:0 0 0 1px var(--edge),0 1px 2px rgb(var(--shadow) / .06);
    --sh-card:0 0 0 1px var(--edge),0 1px 2px rgb(var(--shadow) / .05),0 10px 28px -14px rgb(var(--shadow) / .22);
    --sh-img:0 1px 3px rgb(0 0 0 / .22),0 0 0 .5px rgb(0 0 0 / .1);
    --r-lg:20px; --r-md:14px; --r-sm:10px;
    --f-ui:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --gut-l:max(16px, env(safe-area-inset-left, 0px));
    --gut-r:max(16px, env(safe-area-inset-right, 0px));
    --safe-t:env(safe-area-inset-top, 0px);
    --safe-b:env(safe-area-inset-bottom, 0px);
    --tab-h:58px; --rail-w:88px;
    /* mana pips */
    --m-w:#F8F5DF; --m-u:#A7D6F2; --m-b:#C6BDBA; --m-r:#F4A88C; --m-g:#9BD0AD; --m-c:#CFC8C5; --m-ink:#17140F;
    /* rarity */
    --ra-c:#6E727C; --ra-u:#5F7A90; --ra-r:#A9822A; --ra-m:#D4521B;
    --foil:linear-gradient(115deg,#FF9FB3,#FFD27A 30%,#9DF0C0 55%,#8FC7FF 78%,#D7A6FF);
    --etched:linear-gradient(115deg,#C9CED6,#F5F6F8 40%,#AEB5C0 70%,#E6E8EC);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0D0E10; --surface:#17181C; --surface-2:#1F2125; --surface-3:#2A2C31;
      --text:#ECEDF0; --muted:#9A9EA8; --faint:#6C707A;
      --line:#26282D; --edge:rgb(255 255 255 / .07);
      --accent:#FF8A3D; --accent-text:#FFA266; --accent-soft:#3A2312; --on-accent:#1F0D02;
      --ok:#4CD787; --ok-soft:#12301F; --warn:#F2C04E; --warn-soft:#33280F; --danger:#FF7D66; --danger-soft:#3A1913;
      --toast-bg:#ECEDF0; --toast-ink:#141518; --toast-act:#B44B0C;
      --scrim:rgb(0 0 0 / .62); --shadow:0 0 0;
      --ra-c:#9A9EA8; --ra-u:#9FB8CC; --ra-r:#E2BC5E; --ra-m:#FF7A3D;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D0E10; --surface:#17181C; --surface-2:#1F2125; --surface-3:#2A2C31;
    --text:#ECEDF0; --muted:#9A9EA8; --faint:#6C707A;
    --line:#26282D; --edge:rgb(255 255 255 / .07);
    --accent:#FF8A3D; --accent-text:#FFA266; --accent-soft:#3A2312; --on-accent:#1F0D02;
    --ok:#4CD787; --ok-soft:#12301F; --warn:#F2C04E; --warn-soft:#33280F; --danger:#FF7D66; --danger-soft:#3A1913;
    --toast-bg:#ECEDF0; --toast-ink:#141518; --toast-act:#B44B0C;
    --scrim:rgb(0 0 0 / .62); --shadow:0 0 0;
    --ra-c:#9A9EA8; --ra-u:#9FB8CC; --ra-r:#E2BC5E; --ra-m:#FF7A3D;
    color-scheme:dark;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);font:16px/1.45 var(--f-ui);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent-text)}
  img{max-width:100%}
  [hidden]{display:none!important}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  svg.i.sm{width:18px;height:18px}

  /* ---------- shell ---------- */
  .shell{min-height:100vh;min-height:100dvh;overflow-x:clip;padding-bottom:calc(var(--tab-h) + var(--safe-b))}
  .page{max-width:1280px;margin:0 auto;padding:6px var(--gut-r) 110px var(--gut-l)}
  .page.narrow{max-width:760px}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;padding-top:var(--safe-t);
    background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);
    -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
    border-bottom:.5px solid transparent;transition:border-color .2s}
  .topbar.scrolled{border-bottom-color:var(--line)}
  .bar-in{max-width:1280px;margin:0 auto;padding:0 var(--gut-r) 0 var(--gut-l)}
  .bar-row{display:flex;align-items:center;gap:8px;min-height:56px}
  .bar-title{flex:1;min-width:0;margin:0;font-size:24px;font-weight:750;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-title small{display:block;font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-sub{padding:0 0 10px}
  .icon-btn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;color:var(--text);flex:none;position:relative}
  .icon-btn:active{background:var(--surface-3)}
  .icon-btn.tint{color:var(--accent-text)}
  .icon-btn .dot{position:absolute;top:7px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center}
  .back{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 0;margin-left:-6px;color:var(--accent-text);font-size:16px;font-weight:500;border-radius:12px}

  .search{display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 12px;background:var(--surface-2);border-radius:12px;color:var(--faint);box-shadow:inset 0 0 0 1px var(--edge)}
  .search:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
  .search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:16px;color:var(--text);-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--faint)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}
  .search .clr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}

  /* ---------- nav: bottom tabs on phones, left rail on desktop ---------- */
  .nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
    padding:0 max(6px,env(safe-area-inset-right,0px)) var(--safe-b) max(6px,env(safe-area-inset-left,0px));
    background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);
    -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:.5px solid var(--line)}
  .nav a{flex:1;max-width:120px;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--faint);text-decoration:none;font-size:11px;font-weight:600;border-radius:12px}
  .nav a[aria-current="page"]{color:var(--accent-text)}
  .nav a[aria-current="page"] svg.i{stroke-width:2.2}
  .brand{display:none}
  @media (min-width:900px){
    .shell{padding-bottom:0;padding-left:calc(var(--rail-w) + env(safe-area-inset-left,0px))}
    .nav{top:0;right:auto;width:calc(var(--rail-w) + env(safe-area-inset-left,0px));flex-direction:column;justify-content:flex-start;gap:4px;
      padding:calc(14px + var(--safe-t)) 8px 14px max(8px,env(safe-area-inset-left,0px));border-top:0;border-right:.5px solid var(--line)}
    .nav a{flex:none;height:64px;max-width:none;font-size:11.5px}
    .nav a:hover{background:var(--surface-2)}
    .nav a[aria-current="page"]{background:var(--accent-soft)}
    .brand{display:grid;place-items:center;height:52px;margin-bottom:10px}
    .brand svg{width:40px;height:40px}
  }

  /* ---------- buttons, chips, segmented ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;
    background:var(--surface);box-shadow:var(--sh-1);font-weight:600;font-size:15px;color:var(--text);white-space:nowrap;text-decoration:none}
  .btn:active{transform:scale(.98)}
  .btn.pri{background:var(--accent);color:var(--on-accent);box-shadow:none}
  .btn.soft{background:var(--accent-soft);color:var(--accent-text);box-shadow:none}
  .btn.danger{color:var(--danger)}
  .btn.pri.danger-fill{background:var(--danger);color:#fff}
  .btn.block{width:100%}
  .btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut-r)) 0 calc(-1 * var(--gut-l));padding:0 var(--gut-r) 2px var(--gut-l)}
  .chips.scroll::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;background:var(--surface);box-shadow:var(--sh-1);
    font-size:14px;font-weight:550;white-space:nowrap;color:var(--text)}
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
  .chip.on{background:var(--accent-soft);color:var(--accent-text);box-shadow:none}
  .chip .x{opacity:.7;font-size:17px;line-height:1}
  .chip .ct{font-size:12px;opacity:.7}
  .seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:var(--surface-3);border-radius:12px}
  .seg button{min-height:38px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgb(0 0 0 / .14)}
  .toolbar{display:flex;align-items:center;gap:6px;padding:10px 0 6px}
  .toolbar .grow{flex:1;min-width:0}
  .summary{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);padding:2px 0 4px}
  .summary b{color:var(--text);font-weight:700}

  /* ---------- section headings + panels ---------- */
  .sect{margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
  .sect h2{margin:0;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .sect .r{margin-left:auto;font-size:13px;color:var(--muted)}
  .panel{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-1);overflow:hidden}
  .panel.pad{padding:14px 16px}
  .row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 16px;text-align:left;border-top:.5px solid var(--line);color:var(--text);text-decoration:none}
  .panel > .row:first-child{border-top:0}
  button.row:active,a.row:active{background:var(--surface-2)}
  .row .main{flex:1;min-width:0}
  .row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .end{flex:none;text-align:right;font-size:14px}
  .row .chev{color:var(--faint)}
  .empty{padding:48px 20px;text-align:center;color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
  .empty .btn{margin-top:14px}
  .note{font-size:13px;color:var(--muted)}

  /* ---------- card images ---------- */
  .cimg{position:relative;aspect-ratio:488/680;border-radius:4.75% / 3.41%;overflow:hidden;background:var(--surface-3);box-shadow:var(--sh-img)}
  .cimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .cimg .ph{position:absolute;inset:0;padding:10% 9%;font-size:12px;font-weight:600;color:var(--muted);line-height:1.25;overflow:hidden}
  .cimg.err img{display:none}

  /* ---------- collection grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:14px 10px;padding-top:6px}
  @media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px}}
  @media (min-width:1200px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
  .tile{display:block;width:100%;text-align:left;content-visibility:auto;contain-intrinsic-size:auto 200px;border-radius:8px}
  .tile:active .cimg{transform:scale(.97)}
  .tile .cimg{transition:transform .12s}
  .tile .qty{position:absolute;top:6%;right:6%;min-width:24px;height:22px;padding:0 6px;border-radius:11px;background:rgb(10 10 12 / .82);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 3px rgb(0 0 0 / .3)}
  .tile .own{position:absolute;left:6%;bottom:5%;padding:2px 7px;border-radius:9px;background:rgb(10 10 12 / .82);color:#fff;font-size:11px;font-weight:700}
  .tile .meta{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:12.5px;min-width:0}
  .tile .meta .p{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .tile .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
  .setc{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ra-c);white-space:nowrap}
  .setc.uncommon{color:var(--ra-u)} .setc.rare{color:var(--ra-r)} .setc.mythic{color:var(--ra-m)}
  .fin{display:inline-block;padding:1px 5px;border-radius:5px;font-size:10px;font-weight:800;color:#2A1A2E;background:var(--foil);letter-spacing:.02em}
  .fin.etched{background:var(--etched);color:#24272D}
  .tile .cimg .fin{position:absolute;top:6%;left:6%;box-shadow:0 1px 3px rgb(0 0 0 / .35)}

  /* ---------- collection list ---------- */
  .list{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-1);overflow:hidden;margin-top:6px}
  .lrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 14px 6px 10px;text-align:left;border-top:.5px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 56px}
  .lrow:first-child{border-top:0}
  .lrow:active{background:var(--surface-2)}
  .lrow .thumb{width:30px;flex:none;border-radius:3px}
  .lrow .q{flex:none;min-width:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
  .lrow .main{flex:1;min-width:0}
  .lrow .t{display:flex;align-items:center;gap:6px;min-width:0}
  .lrow .t span.n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .lrow .s{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .lrow .mana{flex:none;margin-left:auto}
  .lrow .p{flex:none;min-width:58px;text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
  .sentinel{height:1px}

  /* ---------- mana pips ---------- */
  .mana{display:inline-flex;align-items:center;gap:1px;vertical-align:-.12em;white-space:nowrap}
  .ms{display:inline-grid;place-items:center;width:1.05em;height:1.05em;border-radius:50%;background:var(--m-c);color:var(--m-ink);
    font:800 .7em/1 var(--f-ui);box-shadow:-.05em .07em 0 rgb(0 0 0 / .55);flex:none;overflow:hidden;letter-spacing:-.04em}
  .mana .ms{font-size:.7em;width:1.5em;height:1.5em}
  .ms.w{background:var(--m-w)} .ms.u{background:var(--m-u)} .ms.b{background:var(--m-b)} .ms.r{background:var(--m-r)} .ms.g{background:var(--m-g)}
  .ms.q{background:#1D1D1F;color:#fff}
  .ms svg{width:72%;height:72%;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .otext .mana .ms,.otext .ms{font-size:.62em;width:1.6em;height:1.6em;vertical-align:-.1em}
  .pips{display:inline-flex;gap:3px}
  .pips .ms{font-size:11px;width:18px;height:18px}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);z-index:70;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);
    padding:12px 14px 12px 16px;border-radius:14px;background:var(--toast-bg);color:var(--toast-ink);font-size:14.5px;
    box-shadow:0 10px 28px rgb(0 0 0 / .28);animation:toastIn .2s ease}
  .toast button{color:var(--toast-act);font-weight:700;min-height:32px;padding:0 4px}
  .toast .bar{height:4px;border-radius:2px;background:rgb(128 128 128 / .35);width:120px;overflow:hidden}
  .toast .bar i{display:block;height:100%;width:0;background:var(--toast-act);transition:width .2s}
  @media (min-width:900px){.toast{bottom:24px;left:calc(50% + var(--rail-w) / 2)}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---------- FAB ---------- */
  .fab{position:fixed;z-index:25;right:var(--gut-r);bottom:calc(var(--tab-h) + var(--safe-b) + 16px);display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border-radius:26px;
    background:var(--accent);color:var(--on-accent);font-weight:650;font-size:16px;text-decoration:none;
    box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 34%,transparent),0 2px 6px rgb(0 0 0 / .14);transition:transform .2s}
  .fab:active{transform:scale(.96)}
  @media (min-width:900px){.fab{bottom:28px;right:32px}}

  /* ============================ Scryfall request queue ============================ */
  // Every call goes through one chain: ≥120 ms between requests (≥600 ms for /cards/search),
  // 429 retried with backoff. Errors carry .status; offline errors carry .offline.
  let qChain = Promise.resolve(), qLast = 0;
  function sf(pathOrUrl, opts){
    opts = opts || {};
    let url = pathOrUrl.indexOf("http") === 0 ? pathOrUrl : API + pathOrUrl;
    if (url.indexOf(API + "/") !== 0) return Promise.reject(Object.assign(new Error("Blocked request"), { status: 0 }));
    const isSearch = /\/cards\/search/.test(url);
    const run = async () => {
      for (let attempt = 0; attempt < 5; attempt++){

        const wait = qLast + gap - Date.now();
        if (wait > 0) await sleep(wait);
        qLast = Date.now();

          res = await fetch(url, opts.body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(opts.body) } : undefined);

          throw Object.assign(new Error("offline"), { status: 0, offline: true });
        }
        if (res.status === 429){ await sleep(1000 * Math.pow(2, attempt)); continue; }
        let data = null;
        try { data = await res.json(); } catch(e){}
        if (!res.ok){
          const err = new Error((data && data.details) || ("Scryfall error " + res.status));
          err.status = res.status; err.data = data;

        return data;

      throw Object.assign(new Error("Scryfall is busy. Try again in a minute."), { status: 429 });

        '<div class="grid">' + rows.map((r) => tileHtml(r, ownedOracle(r.c))).join("") + "</div>" +
        (srch.next ? '<div style="text-align:center;margin-top:20px"><button class="btn" data-act="moreSearch"' + (srch.loading ? " disabled" : "") + ">" + (srch.loading ? '<span class="spin" style="width:16px;height:16px"></span> Loading…' : "Load more") + "</button></div>" : "");
    },
  };
  async function runSearch(q, more){
    q = (q || "").trim();
    const seq = ++srch.seq;
    if (!q){ srch.keys = []; srch.next = null; srch.ran = false; srch.error = ""; searchScreen.update(); return; }
    srch.loading = true; srch.error = "";
    if (!more){ srch.keys = []; srch.next = null; }
    if (cur.name === "search") searchScreen.update();
    try {
      const data = more ? await sf(srch.next) : await sf("/cards/search?q=" + encodeURIComponent(q));
      if (seq !== srch.seq) return;
      (data.data || []).forEach((raw) => { const c = trimCard(raw); const k = cardKey(c); if (!state.cards[k]) tempCards.set(k, c); else storeFresh(k, c); srch.keys.push(k); });
      srch.total = data.total_cards || srch.keys.length;
      srch.next = data.has_more && data.next_page ? data.next_page : null;
    } catch(e){
      if (seq !== srch.seq) return;
      if (e.status === 404){ srch.keys = more ? srch.keys : []; srch.next = null; srch.total = srch.keys.length; }
      else if (e.status === 400){ srch.error = e.message; }
      else { srch.error = e.offline ? "You're offline, or Scryfall didn't answer." : e.message; }
    }
    srch.loading = false; srch.ran = true;
    if (cur.name === "search") searchScreen.update();
  }
  // A fresher copy of a stored card (e.g. from search) updates prices without losing anything.
  function storeFresh(k, c){ if (state.cards[k] && state.cards[k].id === c.id){ state.cards[k].prices = c.prices; save("cards"); } }
  const debouncedSearch = debounce((q) => runSearch(q), 400);

  /* ============================ card sheet ============================ */
  // ctx: { deck: id, entry: <entry object> } | { wish: true } | {}
  const CS = { k: "", ctx: {}, face: 0, prints: null, printsLoading: false, printsErr: "" };
  function openCard(k, ctx){
    CS.k = k; CS.ctx = ctx || {}; CS.face = 0; CS.prints = null; CS.printsLoading = false; CS.printsErr = "";
    openSheet(cardSheetHtml, { wide: true });
  }
  function finishesFor(c){
    const fs = (c.finishes && c.finishes.length ? c.finishes.slice() : ["nonfoil"]);
    ["nonfoil", "foil", "etched"].forEach((f) => { if (state.collection[ekey(c.set, c.cn, f)] && fs.indexOf(f) < 0) fs.push(f); });
    return fs;
  }
  function stepper(act, f, q, label){
    return '<div class="step" role="group" aria-label="' + esc(label) + '"><button data-act="' + act + '" data-f="' + esc(f) + '" data-d="-1" aria-label="One fewer"' + (q ? "" : " disabled") + '>−</button><output aria-live="polite">' + q + '</output><button data-act="' + act + '" data-f="' + esc(f) + '" data-d="1" aria-label="One more">+</button></div>';
  }
  function deckSections(d){
    const out = [];
    d.entries.forEach((e) => { if (out.indexOf(e.section) < 0) out.push(e.section); });
    return out;
  }
  function cardSheetHtml(){
    const k = CS.k, c = getCard(k);
    if (!c) return '<h2 id="sheetTitle">Card not found</h2><p class="lead">This printing isn\'t in the local card data.</p>';
    const faces = c.faces || [];
    const back = faces[1] && faces[1].img;
    const imgUrl = imgSize(CS.face && back ? faces[1].img : c.img, "large");
    const art = '<div class="cs-art"><div class="cimg"><div class="ph">' + esc(displayName(c)) + "</div>" + (imgUrl ? '<img src="' + esc(imgUrl) + '" alt="' + esc(CS.face && back ? faces[1].name : displayName(c)) + '">' : "") + "</div>" +
      (back ? '<button class="icon-btn flip" data-act="flip" aria-label="Show ' + (CS.face ? "front" : "back") + ' face">' + ICON.flip + "</button>" : "") + "</div>";
    let text = "";
    const hasFaceText = faces.length > 1 && faces.some((f) => f.oracle_text || f.type_line);
    if (hasFaceText){
      text = faces.map((f) => '<div class="face"><h4><span>' + esc(f.name) + "</span>" + manaHtml(f.mana_cost) + "</h4>" + '<div class="cs-type">' + esc(f.type_line) + "</div>" +
        '<div class="otext">' + textHtml(f.oracle_text) + "</div>" + (f.pt ? '<span class="cs-pt">' + esc(f.pt) + "</span>" : "") + "</div>").join("");
    } else {
      text = '<div class="cs-type">' + esc(c.type_line) + "</div>" + '<div class="otext">' + textHtml(c.oracle_text) + "</div>" +

    }
    const legal = c.legal_commander === "legal" ? '<span class="badge ok">Commander legal</span>' : '<span class="badge bad">Not legal in Commander</span>';
    const prices = (c.finishes && c.finishes.length ? c.finishes : ["nonfoil"]).map((f) => "<div><span>" + esc(FINISH_LABEL[f] || f) + "</span><b>" + money(parseFloat(c.prices && c.prices[FINISH_PRICE[f]]) || null) + "</b></div>").join("");
    let html = '<div class="cs">' + art + "<div>" +
      '<h2 class="cs-name" id="sheetTitle"><span>' + esc(displayName(c)) + "</span>" + (hasFaceText ? "" : manaHtml(c.mana_cost)) + "</h2>" +
      (c.flavor_name ? '<div class="cs-real">' + esc(c.name) + "</div>" : "") + text +
      '<div class="cs-set"><span class="setc ' + esc(c.rarity) + '">' + esc(c.set) + "</span><span>" + esc(c.set_name) + "</span><span>#" + esc(c.cn) + "</span><span>" + esc(cap(c.rarity)) + "</span>" + (c.released ? "<span>" + esc(c.released.slice(0, 4)) + "</span>" : "") + "</div>" +
      '<div class="cs-set">' + legal + (c.game_changer ? '<span class="badge warn">Game Changer</span>' : "") + "</div>" +
      '<div style="margin-top:14px"><div class="prices">' + prices + "</div></div>" +
      '<div style="display:grid;gap:12px;margin-top:16px">';
    // deck context
    if (CS.ctx.deck){
      const d = deckById(CS.ctx.deck), e = CS.ctx.entry;
      if (d && e && d.entries.indexOf(e) >= 0){
        const secs = deckSections(d);
        html += '<div class="box"><h3>In ' + esc(d.name) + "</h3>" +
          '<div class="qrow"><div class="lbl">Quantity<small>' + esc(FINISH_LABEL[e.finish] || e.finish) + (e.printing_inferred ? " · printing guessed on import" : "") + "</small></div>" + stepper("dq", e.finish, e.qty, "Deck quantity") + "</div>" +
          '<div class="qrow"><div class="lbl">Section</div><select class="inp" data-change="dsec" aria-label="Section">' + secs.map((s) => '<option value="' + esc(s) + '"' + (s === e.section ? " selected" : "") + ">" + esc(s) + "</option>").join("") + '<option value="__new">New section…</option></select></div>' +
          '<div class="qrow"><div class="lbl">' + deckOwnLabel(c, e) + '</div><button class="btn sm danger" data-act="drm">Remove</button></div></div>';
      }
    }
    // collection
    const fs = finishesFor(c);
    const ownedHere = fs.reduce((a, f) => a + ((state.collection[ekey(c.set, c.cn, f)] || {}).qty || 0), 0);
    const other = ownedOracle(c) - ownedHere;
    let binderRow = "";
    if (ownedHere){
      const curB = (fs.map((f) => state.collection[ekey(c.set, c.cn, f)]).find((e) => e && e.binder) || {}).binder || "";
      binderRow = '<div class="qrow"><div class="lbl">Binder</div><select class="inp" data-change="cBinder" aria-label="Binder"><option value="">None</option>' +
        state.binders.map((b) => '<option value="' + esc(b.id) + '"' + (b.id === curB ? " selected" : "") + ">" + esc(b.name) + "</option>").join("") + '<option value="__new">New binder…</option></select></div>';
    }
    html += '<div class="box"><h3>In your collection</h3>' + fs.map((f) => {
      const e = state.collection[ekey(c.set, c.cn, f)];
      return '<div class="qrow"><div class="lbl">' + esc(FINISH_LABEL[f] || f) + "<small>" + money(cardPrice(c, f)) + (e && e.added ? " · added " + esc(fmtDate(e.added)) : "") + "</small></div>" + stepper("cq", f, e ? e.qty : 0, FINISH_LABEL[f] + " quantity") + "</div>";
    }).join("") + binderRow + (other > 0 ? '<div class="qrow"><div class="lbl"><small>You also own ' + plural(other, "copy", "copies") + " in other printings.</small></div></div>" : "") + "</div>";
    // wishlist
    let wfs = fs.filter((f) => state.wishlist[ekey(c.set, c.cn, f)]);
    if (!wfs.length) wfs = [fs[0]];
    html += '<div class="box"><h3>Wishlist</h3>' + wfs.map((wf) => {
      const we = state.wishlist[ekey(c.set, c.cn, wf)];
      return '<div class="qrow"><div class="lbl">Wanted<small>' + esc(FINISH_LABEL[wf] || wf) + "</small></div>" + stepper("wq", wf, we ? we.qty : 0, "Wishlist quantity") + "</div>" +
        (we ? '<div class="qrow"><div class="lbl"><small>Got it? Moves it into your collection.</small></div><button class="btn sm soft" data-act="acquire" data-f="' + esc(wf) + '">Mark acquired</button></div>' : "");
    }).join("") + "</div>";
    // actions
    html += '<div class="acts"><button class="btn" data-act="prints">' + ICON.prints + "Other printings</button>" +
      '<a class="btn" href="https://scryfall.com/card/' + encodeURIComponent(c.set) + "/" + encodeURIComponent(c.cn) + '" target="_blank" rel="noopener">' + ICON.ext + "Scryfall</a></div>" +
      (state.decks.length ? '<select class="inp" data-change="addToDeck" aria-label="Add to a deck"><option value="">Add to a deck…</option>' + state.decks.map((d) => '<option value="' + esc(d.id) + '">' + esc(d.name) + "</option>").join("") + "</select>" : "");
    html += printsHtml();
    html += "</div></div></div>";
    return html;
  }
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
  function printsHtml(){
    if (!CS.prints && !CS.printsLoading && !CS.printsErr) return "";
    let inner;
    if (CS.printsLoading) inner = '<div class="loading" style="padding:20px"><span class="spin"></span></div>';
    else if (CS.printsErr) inner = '<p class="note">' + esc(CS.printsErr) + "</p>";
    else if (!CS.prints.length) inner = '<p class="note">No other printings found.</p>';
    else {
      const curC = getCard(CS.k);
      const ownedHere = finishesFor(curC).some((f) => state.collection[ekey(curC.set, curC.cn, f)]);
      inner = '<div class="prints">' + CS.prints.map((k) => {
        const c = getCard(k); if (!c) return "";
        const isCur = k === CS.k, own = ownedPrint(k);
        let btns = "";
        if (!isCur){
          if (CS.ctx.deck && CS.ctx.entry) btns += '<button class="btn sm" data-act="pUse" data-k="' + esc(k) + '">Use in deck</button>';
          else if (ownedHere) btns += '<button class="btn sm" data-act="pSwitch" data-k="' + esc(k) + '">Switch</button>';
          btns += '<button class="btn sm soft" data-act="pAdd" data-k="' + esc(k) + '" aria-label="Add this printing to collection">+ Add</button>';
        } else btns = '<span class="badge acc">This one</span>';
        return '<div class="prow' + (isCur ? " cur" : "") + '"><button class="thumb" data-act="pView" data-k="' + esc(k) + '" aria-label="View ' + esc(c.set_name) + ' printing">' + cimg(c, "small") + "</button>" +
          '<div class="main"><b>' + esc(c.set_name) + '</b><span class="setc ' + esc(c.rarity) + '">' + esc(c.set) + '</span> <span class="faint">#' + esc(c.cn) + " · " + esc((c.released || "").slice(0, 4)) + "</span> · " + money(cardPrice(c, "nonfoil")) +
          (own ? ' · <span style="color:var(--ok);font-weight:700">Owned ×' + own + "</span>" : "") + "</div>" + btns + "</div>";
      }).join("") + "</div>";
    }
    return '<div class="box" id="printsBox"><h3>Printings</h3>' + inner + "</div>";
  }
  async function loadPrints(){
    const c = getCard(CS.k); if (!c) return;
    CS.printsLoading = true; CS.printsErr = ""; CS.prints = null; rerenderSheet();
    const k0 = CS.k;
    const grab = async (q) => {
      const keys = []; let url = "/cards/search?q=" + encodeURIComponent(q) + "&unique=prints&order=released";
      for (let page = 0; url && page < 4; page++){
        const data = await sf(url);
        (data.data || []).forEach((raw) => { const t = trimCard(raw); const k = cardKey(t); if (!state.cards[k]) tempCards.set(k, t); else storeFresh(k, t); keys.push(k); });
        url = data.has_more ? data.next_page : null;
      }
      return keys;
    };
    try {
      let keys = [];
      try { keys = await grab('!"' + c.name.replace(/"/g, "") + '"'); }
      catch(e){ if (e.status !== 404 || !c.oracle_id) throw e; }
      if (!keys.length && c.oracle_id) keys = await grab("oracleid:" + c.oracle_id);
      if (CS.k !== k0) return;
      CS.prints = keys;
    } catch(e){
      if (CS.k !== k0) return;
      CS.printsErr = e.offline ? "You're offline, or Scryfall didn't answer." : e.status === 404 ? "No printings found." : e.message;
    }
    CS.printsLoading = false;
    rerenderSheet();
    const box = $("printsBox"); if (box && box.scrollIntoView) box.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth" });
  }

  /* ---------- collection / wishlist mutations ---------- */
  function setQty(store, set, cn, finish, qty, extra){
    const k = ekey(set, cn, finish);
    const e = state[store][k];
    if (qty <= 0){ delete state[store][k]; }
    else if (e){ e.qty = qty; }
    else { state[store][k] = Object.assign({ set, cn, finish, qty, added: today() }, extra || {}); }
    touch(); save(store);
  }
  function adjustColl(k, finish, d){
    const c = ensureCard(k) || getCard(k); if (!c) return;
    const e = state.collection[ekey(c.set, c.cn, finish)];
    const q = (e ? e.qty : 0) + d;
    if (q <= 0 && e){
      withUndo("Removed " + displayName(c) + (finish !== "nonfoil" ? " (" + FINISH_LABEL[finish].toLowerCase() + ")" : ""), () => setQty("collection", c.set, c.cn, finish, 0));
    } else if (q > 0){
      const binder = e ? undefined : (finishesFor(c).map((f) => state.collection[ekey(c.set, c.cn, f)]).find((x) => x && x.binder) || {}).binder;
      setQty("collection", c.set, c.cn, finish, q, binder ? { binder } : null);

  }
  function adjustWish(k, finish, d){
    const c = ensureCard(k) || getCard(k); if (!c) return;

    if (q <= 0 && e) withUndo("Removed from wishlist", () => setQty("wishlist", c.set, c.cn, finish, 0));

  function acquire(set, cn, finish){
    const k = ekey(set, cn, finish), w = state.wishlist[k]; if (!w) return;

      if (e) e.qty += w.qty; else state.collection[k] = { set, cn, finish, qty: w.qty, added: today() };

  }
  function setBinder(c, id){
    finishesFor(c).forEach((f) => { const e = state.collection[ekey(c.set, c.cn, f)]; if (e){ if (id) e.binder = id; else delete e.binder; } });

  // Move every finish of the current printing onto another printing.
  function switchPrinting(fromK, toK){
    const a = getCard(fromK), b = ensureCard(toK) || getCard(toK); if (!a || !b) return;

      finishesFor(a).forEach((f) => {
        const e = state.collection[ekey(a.set, a.cn, f)]; if (!e) return;
        const nf = (b.finishes || []).indexOf(f) >= 0 ? f : ((b.finishes || [])[0] || "nonfoil");
        const nk = ekey(b.set, b.cn, nf), ex = state.collection[nk];

        delete state.collection[ekey(a.set, a.cn, f)];
      });

  }

  /* ============================ decks: model ============================ */
  const deckById = (id) => state.decks.find((d) => d.id === id) || null;
  const deckCount = (d) => d.entries.reduce((a, e) => a + (e.qty || 0), 0);
  const isCmdSection = (s) => /^commanders?$/i.test(String(s || "").trim());
  function deckCommanders(d){
    const out = d.entries.filter((e) => isCmdSection(e.section)).map((e) => getCard(e.set + ":" + e.cn)).filter(Boolean);
    if (!out.length && d.commander){
      const n = fold(d.commander);
      const e = d.entries.find((x) => { const c = getCard(x.set + ":" + x.cn); return c && nameKeys(c).indexOf(n) >= 0; });
      if (e) out.push(getCard(e.set + ":" + e.cn));
    }
    return out;
  }
  function deckIdentity(d){
    const cmd = deckCommanders(d), set = new Set();
    (cmd.length ? cmd : d.entries.map((e) => getCard(e.set + ":" + e.cn)).filter(Boolean)).forEach((c) => (c.color_identity || []).forEach((x) => set.add(x)));
    return Array.from(set);
  }
  const deckValue = (d) => d.entries.reduce((a, e) => a + (entryPrice(e) || 0) * e.qty, 0);
  function ownState(c, e){
    if (isBasic(c)) return "basic";
    if (ownedPrint(e.set + ":" + e.cn) > 0) return "own";
    if (ownedOracle(c) > 0) return "alt";
    return "miss";
  }
  function deckOwnLabel(c, e){
    const s = ownState(c, e);
    return s === "basic" ? '<span class="badge">Basic land</span>' : s === "own" ? '<span class="badge ok">Owned</span>' :
      s === "alt" ? '<span class="badge ok">Owned · different printing</span>' : '<span class="badge bad">Missing</span>';
  }
  function deckTouched(d){ d.updated = today(); d.count = deckCount(d); touch(); save("decks"); }
  function addCardToDeck(d, k, finish, section){
    const c = ensureCard(k) || getCard(k); if (!c) return;
    const f = finish && (c.finishes || []).indexOf(finish) >= 0 ? finish : ((c.finishes || []).indexOf("nonfoil") >= 0 ? "nonfoil" : (c.finishes || ["nonfoil"])[0]);
    const ex = d.entries.find((e) => e.set === c.set && e.cn === c.cn && e.finish === f && (!section || e.section === section));
    if (ex) ex.qty += 1;
    else d.entries.push({ set: c.set, cn: c.cn, finish: f, qty: 1, section: section || TYPE_SECTION[mainType(c)] });

  }

  /* ============================ decks: list screen ============================ */
  const decksScreen = {
    mount(){
      const tiles = state.decks.slice().sort((a, b) => String(b.updated || "").localeCompare(String(a.updated || "")) || a.name.localeCompare(b.name)).map((d) => {

        return '<a class="dtile" href="#/deck/' + encodeURIComponent(d.id) + '"><div class="dart">' + art + pipsHtml(deckIdentity(d)) + (d.bracket ? '<span class="br">Bracket ' + esc(d.bracket) + "</span>" : "") + "</div>" +
          '<div class="body"><div class="nm">' + esc(d.name) + "</div>" + '<div class="sub">' + esc(cap(d.format || "")) + (d.commander ? " · " + esc(d.commander) : "") + "</div>" +
          '<div class="stats num"><span><b>' + deckCount(d) + "</b> cards</span><span><b>" + money(deckValue(d)) + "</b></span></div></div></a>";
      }).join("");
      $("screen").innerHTML = topbar({ title: "Decks", actions: '<button class="icon-btn tint" data-act="newDeck" aria-label="New deck">' + ICON.plus + "</button>" }) +

        '<button class="fab" data-act="newDeck">' + ICON.plus + "<span>New deck</span></button>";
    },
  };
  const FORMATS = ["commander", "standard", "pioneer", "modern", "legacy", "vintage", "pauper", "brawl", "other"];
  function newDeckSheet(){
    openSheet(() => '<h2 id="sheetTitle">New deck</h2><form data-submit="newDeck">' +
      '<label class="field"><span>Name</span><input class="inp" name="name" maxlength="120" required autocomplete="off" autofocus placeholder="e.g. Atraxa Superfriends"></label>' +
      '<label class="field"><span>Format</span><select class="inp" name="format">' + FORMATS.map((f) => '<option value="' + f + '">' + cap(f) + "</option>").join("") + "</select></label>" +
      '<label class="field"><span>Paste a list (optional)</span><textarea class="inp" name="list" spellcheck="false" placeholder="# Commander&#10;1 Atraxa, Praetors\' Voice (cm2) 10&#10;# Creatures&#10;1 Sol Ring"></textarea></label>' +
      '<p class="note">One card per line: <code>qty Name (set) number</code>, optional <code>*F*</code> foil or <code>*E*</code> etched. <code># Section</code> lines start a section.</p>' +
      '<div class="sheet-actions"><button type="button" class="btn" data-act="sheetClose">Cancel</button><button class="btn pri" type="submit">Create</button></div></form>');
  }

  /* ============================ deck text format ============================ */
  const LINE_RE = /^\s*(\d+)\s+(.+?)(?:\s+\(([a-z0-9]{3,5})\)\s*(\S+))?(?:\s+\*(F|E)\*)?\s*$/i;
  function parseList(text){
    const items = []; let section = null, bad = 0;
    String(text || "").split(/\r?\n/).forEach((raw) => {
      let line = raw.trim();
      if (!line) return;
      if (/^(#|\/\/)/.test(line)){ section = line.replace(/^(#+|\/\/)\s*/, "").trim() || section; return; }
      line = line.replace(/^(\d+)x\s/i, "$1 ");
      const m = LINE_RE.exec(line);
      if (!m){ if (/^[A-Za-z][\w &'\-]{0,30}:?$/.test(line)) section = line.replace(/:$/, ""); else bad++; return; }
      items.push({ qty: parseInt(m[1], 10), name: m[2].trim(), set: m[3] ? m[3].toLowerCase() : "", cn: m[4] || "", finish: m[5] ? (m[5].toUpperCase() === "F" ? "foil" : "etched") : "nonfoil", section });
    });

  }
  const lineOf = (qty, c, e) => qty + " " + c.name + " (" + c.set + ") " + c.cn + (e.finish === "foil" ? " *F*" : e.finish === "etched" ? " *E*" : "");

    const secs = deckSections(d).sort((a, b) => (isCmdSection(b) ? 1 : 0) - (isCmdSection(a) ? 1 : 0));

  // Resolve [{id?, set?, cn?, name?}] to card keys, fetching unknown printings in 75-card batches.
  async function resolveCards(items, label){
    const out = new Array(items.length).fill(null);
    const I = ix(), need = [];
    items.forEach((it, i) => {
      if (it.id && I.byId.has(it.id)){ out[i] = I.byId.get(it.id); return; }
      if (it.set && it.cn && state.cards[it.set + ":" + it.cn]){ out[i] = it.set + ":" + it.cn; return; }
      if (!it.set && !it.id && it.name){ const k = localByName(it.name); if (k){ out[i] = k; return; } }
      need.push(i);
    });
    if (!need.length) return out;
    const keyOf = (o) => o.id ? "id:" + o.id : o.set ? "s:" + o.set + ":" + String(o.collector_number).toLowerCase() : "n:" + fold(o.name);
    const pass = async (idx, identOf) => {
      const map = new Map(), idents = [];
      idx.forEach((i) => { const o = identOf(items[i]); if (!o) return; const kk = keyOf(o); if (!map.has(kk)){ map.set(kk, []); idents.push(o); } map.get(kk).push(i); });
      if (!idents.length) return;
      const pg = progress(label || "Fetching cards");
      try {
        const res = await fetchCollection(idents, (n, t) => pg.set(n, t));
        res.found.forEach((raw) => {
          const c = trimCard(raw), k = storeCard(c);
          ["id:" + c.id, "s:" + c.set + ":" + String(c.cn).toLowerCase()].concat(nameKeys(c).map((n) => "n:" + n)).forEach((kk) => (map.get(kk) || []).forEach((i) => { if (!out[i]) out[i] = k; }));
        });
      } finally { pg.done(); }
    };
    await pass(need, (it) => it.id ? { id: it.id } : (it.set && it.cn) ? { set: it.set, collector_number: it.cn } : it.name ? { name: it.name } : null);
    const retry = need.filter((i) => !out[i] && items[i].name && (items[i].set || items[i].id));
    if (retry.length){
      retry.forEach((i) => { const k = localByName(items[i].name); if (k) out[i] = k; });
      await pass(retry.filter((i) => !out[i]), (it) => ({ name: it.name }));
    }

  }

  function commanderChecks(d, rows){

    const cmd = deckCommanders(d);

  /* ---------- files: share sheet or download ---------- */
  function saveFile(name, text, mime){
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  // Opens the phone's share sheet (Save to Files, AirDrop…); falls back to a plain download.
  async function shareFile(name, text, mime){
    try {
      const file = new File([text], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia("(pointer:coarse)").matches){
        await navigator.share({ files: [file], title: name });
        return "shared";
      }
    } catch(e){
      if (e && e.name === "AbortError") return "cancelled";
    }
    saveFile(name, text, mime);
    return "saved";
  }
  async function copyText(text){

  function pickFile(accept){
    return new Promise((resolve) => {
      const inp = $("filePick");
      inp.value = ""; inp.accept = accept || "";
      inp.onchange = () => {
        const f = inp.files && inp.files[0]; if (!f) return resolve(null);
        const r = new FileReader();
        r.onload = () => resolve({ name: f.name, text: String(r.result || "") });
        r.onerror = () => { toast("Couldn't read that file."); resolve(null); };
        r.readAsText(f);
      };
      inp.click();
    });
  }
  const stamp = () => today();

  /* ---------- CSV ---------- */
  function parseCSV(text){
    text = String(text || "").replace(/^﻿/, "");
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++){
      const ch = text[i];
      if (q){
        if (ch === '"'){ if (text[i + 1] === '"'){ field += '"'; i++; } else q = false; }
        else field += ch;
      } else if (ch === '"' && field === "") q = true;
      else if (ch === ","){ row.push(field); field = ""; }
      else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && text[i + 1] === "\n") i++; row.push(field); field = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
      else field += ch;
    }
    if (field !== "" || row.length){ row.push(field); if (row.length > 1 || row[0] !== "") rows.push(row); }
    return rows;
  }
  const csvCell = (v) => { const s = v == null ? "" : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csvLine = (arr) => arr.map(csvCell).join(",");
  function csvItems(rows){
    if (rows.length < 1) return null;
    const head = rows[0].map((x) => x.trim().toLowerCase());
    const col = (...names) => { for (const n of names){ const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
    let format = null;
    if (col("set code") >= 0 && col("collector number") >= 0) format = "ManaBox";
    else if (col("count") >= 0 && col("edition") >= 0) format = "Moxfield";
    else if (col("name") >= 0 && col("quantity", "count", "qty") >= 0) format = "CSV";
    if (!format) return null;
    const ci = { name: col("name", "card name"), set: col("set code", "edition", "set"), cn: col("collector number", "number", "cn"), foil: col("foil", "finish", "printing"),
      qty: col("quantity", "count", "qty"), id: col("scryfall id", "scryfall_id"), price: col("purchase price"), binder: col("binder name"), btype: col("binder type") };
    const get = (r, k) => ci[k] >= 0 ? String(r[ci[k]] == null ? "" : r[ci[k]]).trim() : "";
    const items = []; let bad = 0;
    rows.slice(1).forEach((r) => {
      const qty = parseInt(get(r, "qty") || "1", 10);
      const name = get(r, "name"), id = get(r, "id"), set = get(r, "set").toLowerCase(), cn = get(r, "cn");
      if (!(qty > 0) || (!name && !id && !(set && cn))){ bad++; return; }
      const fv = get(r, "foil").toLowerCase();
      const finish = /etch/.test(fv) ? "etched" : (fv === "foil" || fv === "true" || fv === "yes") ? "foil" : "nonfoil";
      const price = parseFloat(get(r, "price"));
      const btype = get(r, "btype").toLowerCase();
      items.push({ qty, name, id: /^[0-9a-f-]{36}$/i.test(id) ? id.toLowerCase() : "", set, cn, finish, price: isFinite(price) && price > 0 ? price : null, binder: (btype === "deck" || btype === "list") ? "" : get(r, "binder") });
    });
    return { format, items, bad };
  }
  async function importCollectionItems(items, bad, replace, label){
    let keys;
    try { keys = await resolveCards(items, label || "Importing"); }
    catch(e){ netError(e, "Import stopped."); return; }
    if (replace){ state.collection = {}; }
    let added = 0, skipped = bad || 0;
    const binderByName = new Map(state.binders.map((b) => [fold(b.name), b]));
    items.forEach((it, i) => {
      const c = keys[i] && getCard(keys[i]);
      if (!c){ skipped++; return; }
      const f = (c.finishes || []).indexOf(it.finish) >= 0 ? it.finish : ((c.finishes || [])[0] || it.finish);
      const k = ekey(c.set, c.cn, f);
      const e = state.collection[k];
      if (e) e.qty += it.qty;
      else {
        state.collection[k] = { set: c.set, cn: c.cn, finish: f, qty: it.qty, added: today() };
        if (it.price != null) state.collection[k].price_usd = it.price;
      }
      if (it.binder){
        let b = binderByName.get(fold(it.binder));
        if (!b){ b = { id: uid("b"), name: it.binder }; state.binders.push(b); binderByName.set(fold(it.binder), b); }
        state.collection[k].binder = b.id;
      }
      added += it.qty;
    });
    touch(); save("collection", "binders", "cards"); refresh();
    toast("Imported: " + plural(added, "card") + " added" + (skipped ? ", " + skipped + " skipped" : "") + ".", null, 5000);
  }

  async function refreshPrices(){
    const keys = new Set();
    Object.values(state.collection).concat(Object.values(state.wishlist)).forEach((e) => keys.add(e.set + ":" + e.cn));
    state.decks.forEach((d) => d.entries.forEach((e) => keys.add(e.set + ":" + e.cn)));
    const idents = Array.from(keys).map((k) => { const c = state.cards[k]; const [set, cn] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)]; return c && c.id ? { id: c.id } : { set, collector_number: cn }; });
    if (!idents.length){ toast("Nothing to price yet."); return; }
    const pg = progress("Refreshing prices");
    try {
      const res = await fetchCollection(idents, (n, t) => pg.set(n, t));
      res.found.forEach((raw) => storeCard(trimCard(raw)));
      state.meta.pricedAt = today();
      touch(); save("cards", "meta"); pg.done(); refresh();
      toast("Prices updated for " + plural(res.found.length, "printing") + (res.notFound.length ? " (" + res.notFound.length + " not found)" : "") + ".");
    } catch(e){ pg.done(); netError(e, "Price refresh stopped."); }

  function loadSeed(seed){
    state.collection = seed.collection || {}; state.wishlist = seed.wishlist || {};
    state.decks = Array.isArray(seed.decks) ? seed.decks : []; state.binders = Array.isArray(seed.binders) ? seed.binders : [];
    state.cards = seed.cards || {};
    state.meta = { seedVersion: seed.seedVersion || "", pricedAt: seed.pricedAt || seed.seedVersion || "", tiers: (seed.config && seed.config.tiers) || [2, 10, 40], loadedAt: new Date().toISOString() };
    normaliseState(); touch(); save();
  }
  async function reloadSeed(){
    if (!(await confirmSheet({ title: "Reload published collection?", message: "This replaces the collection, wishlist, decks and binders on this device with the published list. Make a backup first if you've made changes here.", ok: "Replace", danger: true }))) return;
    try { const seed = await fetchSeed(); loadSeed(seed); tempCards.clear(); refresh(); toast("Loaded published collection (" + (seed.seedVersion || "latest") + ")."); }
    catch(e){ toast("Couldn't load the published collection. Are you online?"); }
  }
  function normaliseState(){
    if (!state.collection || typeof state.collection !== "object") state.collection = {};
    if (!state.wishlist || typeof state.wishlist !== "object") state.wishlist = {};
    if (!Array.isArray(state.decks)) state.decks = [];
    if (!Array.isArray(state.binders)) state.binders = [];
    if (!state.cards || typeof state.cards !== "object") state.cards = {};
    if (!state.meta || typeof state.meta !== "object") state.meta = {};
    if (!Array.isArray(state.meta.tiers) || state.meta.tiers.length !== 3) state.meta.tiers = [2, 10, 40];
    state.decks.forEach((d) => { if (!Array.isArray(d.entries)) d.entries = []; if (!d.format) d.format = "commander"; d.entries.forEach((e) => { if (!e.section) e.section = "Main"; if (!e.finish) e.finish = "nonfoil"; }); });
  }

  /* ============================ routes table ============================ */
  const routes = {
    collection: collScreen,
    binder: collScreen,
    search: searchScreen,
    decks: decksScreen,
    deck: deckScreen,
    lists: listsScreen,
    wishlist: wishScreen,
    more: moreScreen,
  };

  /* ============================ event wiring ============================ */
  // Every interactive element names its handler with data-act / data-change / data-input / data-submit.
  const curDeckEntry = () => { const d = CS.ctx.deck && deckById(CS.ctx.deck); return d && CS.ctx.entry && d.entries.indexOf(CS.ctx.entry) >= 0 ? { d, e: CS.ctx.entry } : null; };
  const ACT = {
    sheetClose: () => closeSheet(),
    cfNo: () => closeSheet(),
    cfYes: () => { if (CONFIRM.resolve) CONFIRM.resolve(true); },
    opt: (el) => { const it = OPTS.items[+el.dataset.i]; if (it) closeSheet(() => it.run()); },
    // collection
    toggleView: () => { prefs.view = prefs.view === "grid" ? "list" : "grid"; savePrefs(); coll.shownFn = null; collScreen.mount(coll.binder); },
    sortSheet: () => openSheet(sortSheetHtml),
    filterSheet: () => openSheet(filterSheetHtml),
    clearQ: () => { coll.q = ""; const i = $("cQ"); if (i){ i.value = ""; i.focus(); } coll.shownFn = null; collScreen.update(); },
    unfilter: (el) => { const g = el.dataset.g, v = el.dataset.v; if (g === "binder") coll.f.binder = ""; else coll.f[g] = coll.f[g].filter((x) => x !== v); coll.shownFn = null; collScreen.update(); },
    clearFilters: () => { coll.f = { colors: [], types: [], rarity: [], sets: [], tiers: [], finish: [], binder: "" }; coll.shownFn = null; collScreen.update(); rerenderSheet(); },
    clearAll: () => { coll.q = ""; const i = $("cQ"); if (i) i.value = ""; ACT.clearFilters(); },
    fToggle: (el) => { const g = el.dataset.g, v = el.dataset.v, a = coll.f[g]; const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); coll.shownFn = null; collScreen.update(); rerenderSheet(); },
    setSort: (el) => { prefs.sort = el.dataset.v; if (el.dataset.v === "price" || el.dataset.v === "added") prefs.dir = "desc"; else prefs.dir = "asc"; savePrefs(); coll.shownFn = null; refresh(); rerenderSheet(); },
    setDir: (el) => { prefs.dir = el.dataset.v; savePrefs(); coll.shownFn = null; refresh(); rerenderSheet(); },
    card: (el) => openCard(el.dataset.k, el.dataset.ctx === "wish" ? { wish: true } : {}),
    // search
    exSearch: (el) => { srch.q = el.dataset.v; const i = $("sQ"); if (i) i.value = srch.q; runSearch(srch.q); },
    retrySearch: () => runSearch(srch.q),
    moreSearch: () => { if (srch.next && !srch.loading) runSearch(srch.q, true); },
    clearS: () => { srch.q = ""; const i = $("sQ"); if (i){ i.value = ""; i.focus(); } runSearch(""); },
    // card sheet
    flip: () => { CS.face = CS.face ? 0 : 1; rerenderSheet(); },
    cq: (el) => adjustColl(CS.k, el.dataset.f, +el.dataset.d),
    wq: (el) => adjustWish(CS.k, el.dataset.f, +el.dataset.d),
    acquire: (el) => { const c = getCard(CS.k); if (c) acquire(c.set, c.cn, el.dataset.f); },
    prints: () => loadPrints(),
    pSwitch: (el) => switchPrinting(CS.k, el.dataset.k),
    pAdd: (el) => { const c = getCard(el.dataset.k); if (!c) return; const f = (c.finishes || []).indexOf("nonfoil") >= 0 ? "nonfoil" : ((c.finishes || [])[0] || "nonfoil"); const back = CS.k; CS.k = el.dataset.k; adjustColl(el.dataset.k, f, 1); CS.k = back; rerenderSheet(); },
    pUse: (el) => {
      const x = curDeckEntry(), c = ensureCard(el.dataset.k) || getCard(el.dataset.k); if (!x || !c) return;
      x.e.set = c.set; x.e.cn = c.cn; delete x.e.printing_inferred;
      if ((c.finishes || []).indexOf(x.e.finish) < 0) x.e.finish = (c.finishes || [])[0] || "nonfoil";
      deckTouched(x.d); CS.k = el.dataset.k; rerenderSheet(); refresh(); toast("Deck now uses " + c.set.toUpperCase() + " #" + c.cn + ".");
    },
    pView: (el) => { const ctx = CS.ctx; openCard(el.dataset.k, ctx.deck ? {} : ctx); },
    dq: (el) => {
      const x = curDeckEntry(); if (!x) return;
      const q = x.e.qty + (+el.dataset.d);
      if (q <= 0){ ACT.drm(); return; }
      x.e.qty = q; deckTouched(x.d); rerenderSheet(); refresh();
    },
    drm: () => {
      const x = curDeckEntry(); if (!x) return;
      const c = getCard(x.e.set + ":" + x.e.cn);
      closeSheet(() => withUndo("Removed " + displayName(c) + " from the deck", () => { x.d.entries.splice(x.d.entries.indexOf(x.e), 1); deckTouched(x.d); refresh(); }));
    },
    // decks
    newDeck: () => newDeckSheet(),
    deckMenu: () => deckMenu(),
    deckCard: (el) => { const d = deckById(dv.id); const e = d && d.entries[+el.dataset.i]; if (e) openCard(e.set + ":" + e.cn, { deck: d.id, entry: e }); },
    dGroup: (el) => { prefs.deckGroup = el.dataset.v; savePrefs(); deckScreen.update(); },
    dTab: (el) => { dv.tab = el.dataset.v; deckScreen.update(); },
    dAddPick: (el) => { const s = dv.sug[+el.dataset.i]; if (s) deckAddByName(s.name); },
    // lists
    newBinder: () => newBinder(),
    binderMenu: (el) => binderMenu(el.dataset.id),
    // more
    impCSV: () => importCSV(),
    csvGo: async (el) => {
      const p = CSVJOB.parsed; if (!p) return;
      if (el.dataset.v === "replace"){
        if (!(await confirmSheet({ title: "Replace your collection?", message: "Every card in your collection will be replaced by this file's " + plural(p.items.length, "row") + ". Decks and the wishlist stay.", ok: "Replace", danger: true }))) return;
        importCollectionItems(p.items, p.bad, true, "Importing");
      } else closeSheet(() => importCollectionItems(p.items, p.bad, false, "Importing"));
      CSVJOB.parsed = null;
    },
    expManabox: () => exportManabox(),
    expMoxfield: () => exportMoxfield(),
    impText: () => importTextSheet(),
    expText: () => exportText(),
    backup: () => backupAll(),
    restore: () => restoreBackup(),
    refreshPrices: () => refreshPrices(),
    reloadSeed: () => reloadSeed(),
    setTheme: (el) => { prefs.theme = el.dataset.v; savePrefs(); applyLook(); document.querySelectorAll('[data-act="setTheme"]').forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === prefs.theme))); },
  };
  const CHG = {
    fBinder: (el) => { coll.f.binder = el.value; coll.shownFn = null; collScreen.update(); },
    cBinder: async (el) => {
      const c = getCard(CS.k); if (!c) return;
      if (el.value === "__new"){
        const keep = CS.k, ctx = CS.ctx;
        const b = await newBinder();
        if (b){ const cc = getCard(keep); setBinder(cc, b.id); }
        openCard(keep, ctx);
        return;
      }
      setBinder(c, el.value);
    },
    dsec: async (el) => {
      const x = curDeckEntry(); if (!x) return;
      let v = el.value;
      if (v === "__new"){
        const keep = CS.k, ctx = CS.ctx;
        v = await promptSheet({ title: "New section", placeholder: "e.g. Ramp", ok: "Move" });
        if (v && v.trim()){ x.e.section = v.trim(); deckTouched(x.d); refresh(); }
        openCard(keep, ctx);
        return;
      }
      x.e.section = v; deckTouched(x.d); refresh(); toast("Moved to " + v + ".");
    },
    addToDeck: (el) => {
      const d = deckById(el.value); el.value = ""; if (!d) return;
      const k = CS.k, c = getCard(k);
      const owned = finishesFor(c).find((f) => state.collection[ekey(c.set, c.cn, f)]);
      addCardToDeck(d, k, owned || null);
      toast("Added " + displayName(c) + " to " + d.name + ".", { label: "Open", run: () => closeSheet(() => { location.hash = "#/deck/" + encodeURIComponent(d.id); }) });
      rerenderSheet(); refresh();
    },
  };
  const INP = {
    collQ: debounce((el) => { coll.q = el.value; coll.shownFn = null; collScreen.update(); }, 90),
    searchQ: (el) => { srch.q = el.value; const clr = document.querySelector("#screen .clr"); if (clr) clr.hidden = !srch.q; debouncedSearch(srch.q); },
    deckAdd: (el) => deckSuggest(el.value),
  };
  const SUB = {
    noop: () => { const i = document.activeElement; if (i && i.blur) i.blur(); },
    search: () => { const i = $("sQ"); srch.q = i ? i.value : srch.q; runSearch(srch.q); if (i) i.blur(); },
    prompt: () => { if (PROMPT.resolve) PROMPT.resolve($("promptIn").value); },
    deckAdd: () => { if (dv.sug[0]) deckAddByName(dv.sug[0].name); else { const v = $("dAdd").value.trim(); if (v) deckAddByName(v); } },
    newDeck: (f) => {
      const name = f.elements.name.value.trim(); if (!name) return;
      const d = { id: slug(name) + "-" + uid().slice(-5), name, format: f.elements.format.value, commander: "", archetype: "", bracket: null, created: today(), updated: today(), count: 0, entries: [] };
      const list = f.elements.list.value;
      state.decks.push(d); save("decks");
      closeSheet(async () => {
        location.hash = "#/deck/" + encodeURIComponent(d.id);
        if (list.trim()) await importIntoDeck(d, list, false);
        refresh();
      });
    },
    deckDetails: (f) => {
      const d = deckById(dv.id); if (!d) return;
      d.format = f.elements.format.value; d.archetype = f.elements.archetype.value.trim(); d.bracket = f.elements.bracket.value ? +f.elements.bracket.value : null;
      deckTouched(d); closeSheet(); refresh();
    },
    importList: (f) => {
      const d = deckById(dv.id); if (!d) return;
      const list = f.elements.list.value, replace = f.elements.mode.value === "replace";
      if (!list.trim()){ toast("Paste a list first."); return; }
      const go = () => importIntoDeck(d, list, replace).then(() => refresh());
      if (replace){
        confirmSheet({ title: "Replace " + d.name + "’s cards?", message: "The deck's current " + plural(deckCount(d), "card") + " will be replaced.", ok: "Replace", danger: true }).then((ok) => { if (ok) go(); });
      } else closeSheet(go);
    },
    importText: (f) => {
      const { items, bad } = parseList(f.elements.list.value);
      if (!items.length){ toast("No card lines found."); return; }
      closeSheet(() => importCollectionItems(items, bad, false, "Importing"));
    },
  };
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName === "BUTTON" || el.tagName === "A") e.preventDefault();
    try { const r = fn(el, e); if (r && r.catch) r.catch((err) => netError(err)); } catch(err){ console.error(err); toast("Something went wrong."); }
  });
  document.addEventListener("change", (e) => {
    const el = e.target.closest("[data-change]"); if (!el) return;
    const fn = CHG[el.dataset.change]; if (fn){ const r = fn(el, e); if (r && r.catch) r.catch((err) => netError(err)); }
  });
  document.addEventListener("input", (e) => {
    const el = e.target.closest("[data-input]"); if (!el) return;
    const fn = INP[el.dataset.input]; if (fn) fn(el, e);
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-submit]"); if (!f) return;
    e.preventDefault();
    const fn = SUB[f.dataset.submit]; if (fn) fn(f, e);
  });
  // Close the deck suggestion list when focus leaves it.
  document.addEventListener("focusin", (e) => { const box = $("dSug"); if (box && !box.hidden && !e.target.closest(".addbox")) box.hidden = true; });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape"){ const box = $("dSug"); if (box && !box.hidden){ box.hidden = true; } } });

  /* ============================ boot ============================ */
  let booted = false;
  async function boot(){
    const ok = await idb.open();
    const got = ok ? await idb.getAll(KEYS) : {};
    if (got.collection === undefined){
      try { loadSeed(await fetchSeed()); await flush(); }
      catch(e){ normaliseState(); toast("Couldn't load the starter collection. You can start from scratch or import a CSV."); }
    } else {
      KEYS.forEach((k) => { if (got[k] !== undefined) state[k] = got[k]; });
      normaliseState();
    }
    if (!ok) toast("This browser can't store data here, so changes won't be kept.");
    touch();
    booted = true;
    if (!location.hash || !routes[parseHash().name]) history.replaceState(null, "", "#/collection");
    render();
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  window.mtgApp = { state, save, routes, flush, version: VERSION };
  boot();
})();
</script>
</body>
</html>
